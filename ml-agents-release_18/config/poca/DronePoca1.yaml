behaviors:
  DronePoca1:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 128
    max_steps: 50000000
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 50   

engine_settings:
  time_scale: 20        
  target_frame_rate: -1  
  no_graphics: true       

env_settings:
  env_path: "C:\\Users\\ajou\\Please\\Builds1\\My project.exe"
  num_envs: 4